name: Build Supergram APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract project
        run: unzip -q Supergram-0.1-project.zip
      - name: Install Android SDK packages
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Build APK and run lint
        working-directory: Supergram
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Supergram-debug-apk
          path: Supergram/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
